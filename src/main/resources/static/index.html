<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Lost & Found Portal</title>
    <!-- Modern Font: Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* --- DESIGN SYSTEM & BASE STYLES --- */
        body { 
            font-family: 'Poppins', sans-serif; 
            /* Subtle Pattern Background in Light Mode */
            background-color: #e5e7eb; 
            transition: background-color 0.3s ease;
        }
        /* Dark Mode Body Styling */
        .dark body {
            background-color: #1a202c; /* Dark charcoal */
        }
        
        /* Glassmorphism Card Style */
        .glass-card { 
            background-color: rgba(255, 255, 255, 0.4); /* Semi-transparent white */
            backdrop-filter: blur(10px); 
            border: 1px solid rgba(255, 255, 255, 0.2); 
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            transition: all 0.3s ease;
        }
        .dark .glass-card {
            background-color: rgba(30, 41, 59, 0.6); /* Semi-transparent dark slate */
            border: 1px solid rgba(100, 116, 139, 0.3);
            box-shadow: 0 4px 12px 0 rgba(0, 0, 0, 0.5);
            color: #e2e8f0;
        }
        .dark .glass-card:hover {
            background-color: rgba(30, 41, 59, 0.8);
        }

        .page-content { max-width: 1400px; margin: 0 auto; padding: 1.5rem; }
        .btn-primary { 
            @apply bg-primary text-white hover:bg-indigo-700 transition duration-300 transform hover:scale-[1.02] shadow-lg shadow-indigo-500/50; 
        }
        .btn-secondary { 
            @apply bg-gray-200 text-gray-800 hover:bg-gray-300 transition duration-300 transform hover:scale-[1.02] shadow-md; 
        }
        .dark .btn-secondary {
            @apply bg-gray-700 text-gray-200 hover:bg-gray-600 shadow-none;
        }
        .text-themed {
            @apply text-primary dark:text-indigo-400;
        }

        /* Subtle Fade-in animation for cards */
        @keyframes fadeInSlideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-entry {
            animation: fadeInSlideUp 0.5s ease-out backwards;
        }

        /* --- MESSENGER STYLES --- */
        #floating-messenger-container {
            z-index: 1000;
            position: fixed;
            bottom: 20px;
            right: 20px;
        }
        .chat-container {
            width: 380px;
            height: 500px;
            max-width: calc(100vw - 40px); /* Responsive max width */
        }
        /* REDESIGNED CHAT BUBBLES */
        .chat-bubble-self {
            @apply bg-primary text-white rounded-t-xl rounded-bl-xl shadow-md;
        }
        .chat-bubble-other {
            @apply bg-gray-200 dark:bg-gray-700 text-gray-900 dark:text-white rounded-t-xl rounded-br-xl shadow-md;
        }
         /* Typing indicator CSS */
        .dot-typing {
            position: relative;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #4f46e5; /* Primary color */
            color: #4f46e5;
            animation: dot-typing 1.5s infinite ease-in-out;
        }
        .dot-typing::before, .dot-typing::after {
            content: '';
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #4f46e5;
            color: #4f46e5;
            animation: dot-typing 1.5s infinite ease-in-out;
        }
        .dot-typing::before {
            left: -12px;
            animation-delay: -0.3s;
        }
        .dot-typing::after {
            left: 12px;
            animation-delay: 0.3s;
        }
        @keyframes dot-typing {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(0.6); opacity: 0.5; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* AI Modal Styles */
        .ai-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
    <script>
        tailwind.config = {
            darkMode: 'class', // Enable dark mode based on 'dark' class on html tag
            theme: {
                extend: {
                    colors: {
                        'primary': '#4f46e5',
                        'success': '#10b981',
                        'danger': '#ef4444',
                        // Gradient colors for header/footer
                        'gradient-start': '#8b5cf6', // Violet/Indigo
                        'gradient-mid': '#ec4899', // Pink
                        'gradient-end': '#f43f5e', // Rose
                    }
                }
            }
        }
    </script>
</head>
<body class="antialiased">
    <!-- Header with Gradient and Glassmorphism (sticky) -->
    <header id="header-nav" class="bg-gradient-to-r from-gradient-start via-gradient-mid to-gradient-end shadow-2xl sticky top-0 z-50 backdrop-blur-md bg-opacity-80">
        <!-- Navigation content will be dynamically rendered here -->
    </header>

    <main id="app-container" class="page-content min-h-[80vh] py-12">
        <!-- Content will be injected here -->
        <div class="text-center p-10 text-gray-500 dark:text-gray-300">Loading application...</div>
    </main>
    
    <!-- AI/Confirmation MODAL CONTAINER (Re-used for generic confirmation) -->
    <div id="ai-draft-modal-container"></div>

    <!-- Footer with Matching Gradient -->
    <footer class="bg-gradient-to-r from-gradient-start via-gradient-mid to-gradient-end text-white text-center p-4 mt-12 shadow-inner">
        <p>&copy; 2024 Campus Lost & Found Portal Demo. Mini-Project by Easwari Engineering College Team.</p>
    </footer>

    <!-- Floating Messenger Container -->
    <div id="floating-messenger-container">
        <!-- Chat widget will be rendered here -->
    </div>

    <script>
        // --- Configuration ---
        const appContainer = document.getElementById('app-container');
        const headerNav = document.getElementById('header-nav');
        const messengerContainer = document.getElementById('floating-messenger-container');
        const aiModalContainer = document.getElementById('ai-draft-modal-container');
        const EASWARI_DOMAIN = '@easwari.edu';
        const HTML_TAG = document.documentElement;
        const LLM_API_KEY = ""; // Mock API Key for demo structure
        const BACKEND_BASE_URL = 'http://localhost:8080'; // IMPORTANT: Assumed Spring Boot location
        
        // --- State Management (Now backed by the actual API) ---
        let items = []; // Items are now loaded from the backend API
        let currentFilter = 'ALL'; 
        let currentUser = null; 
        
        // --- MESSENGER STATE (Still mock data for chat, but uses real item IDs) ---
        let messages = JSON.parse(localStorage.getItem('mockMessages') || '[]');
        let isChatOpen = false;
        let activeChatItemId = null; // ID of the item currently being chatted about
        let isTypingIndicatorActive = false;
        
        // Mock WebSocket Status
        let isOnline = true;
        
        // --- EMOJI DATA ---
        const emojis = ['😀', '👍', '❤️', '🙏', '📚', '🎒', '🔑', '📱', '❓'];

        function saveMessages() {
            localStorage.setItem('mockMessages', JSON.stringify(messages));
        }

        function getUnreadMessageCount() {
            if (!currentUser) return 0;
            const userEmail = currentUser.email;
            return messages.reduce((count, thread) => {
                if (thread.participants.includes(userEmail)) {
                    // Simple logic: If the last message wasn't sent by the current user, assume it's unread
                    const lastMessage = thread.messages[thread.messages.length - 1];
                    if (lastMessage && lastMessage.sender !== userEmail && lastMessage.status !== 'READ') {
                        return count + 1;
                    }
                }
                return 0;
            }, 0);
        }
        
        function getParticipantName(email) {
             // Mock user lookup 
             return email ? email.split('@')[0].split('.').map(s => s.charAt(0).toUpperCase() + s.slice(1)).join(' ') : 'Unknown User';
        }
        
        // --- User Profile Icon/Avatar ---
        function getUserInitials(email) {
            const name = getParticipantName(email);
            return name.charAt(0).toUpperCase();
        }

        function getCategoryIcon(category) {
            switch (category) {
                case 'ID Card': return `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>`;
                case 'Bag/Backpack': return `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 0-8 0"/></svg>`;
                case 'Book/Notebook': return `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>`;
                case 'Electronics': return `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="18" rx="2" ry="2"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="12" y1="16" x2="12" y2="16"/></svg>`;
                case 'Key': return `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="18" r="3"/><path d="M14.4 12.6l-5.4 5.4"/><path d="M16 11V3l4 4-4 4z"/></svg>`;
                case 'Clothing': return `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 7h-5a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h5a1 1 0 0 0 1-1V8a1 1 0 0 0-1-1z"/><path d="M10 7H4a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h6"/></svg>`;
                default: return `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>`; 
            }
        }
        
        function toggleDarkMode() {
            if (HTML_TAG.classList.contains('dark')) {
                HTML_TAG.classList.remove('dark');
                localStorage.setItem('theme', 'light');
            } else {
                HTML_TAG.classList.add('dark');
                localStorage.setItem('theme', 'dark');
            }
            renderNavBar(); 
        }

        function initTheme() {
            const storedTheme = localStorage.getItem('theme');
            const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            
            if (storedTheme === 'dark' || (!storedTheme && systemPrefersDark)) {
                HTML_TAG.classList.add('dark');
            } else {
                HTML_TAG.classList.remove('dark');
            }
        }

        function showMessage(type, message) {
            const msgDiv = document.createElement('div');
            const color = type === 'success' ? 'bg-success border-green-700' : 'bg-danger border-red-700';
            msgDiv.className = `fixed top-5 right-5 z-[100] p-4 rounded-lg shadow-xl text-white font-semibold border-l-4 ${color}`;
            msgDiv.textContent = message;
            document.body.appendChild(msgDiv);
            setTimeout(() => {
                msgDiv.classList.add('opacity-0', 'transition-opacity', 'duration-500');
                msgDiv.addEventListener('transitionend', () => msgDiv.remove());
            }, 3000);
        }

        // --- Confirmation Modal Functions (NEW) ---

        /**
         * Shows a generic confirmation modal instead of using window.confirm().
         * @param {string} message - The confirmation message.
         * @param {function} onConfirm - Function to run if confirmed.
         * @param {string} [confirmText="Delete"] - Text for the confirmation button.
         * @param {string} [cancelText="Cancel"] - Text for the cancel button.
         * @param {string} [confirmColor="bg-danger hover:bg-red-700"] - Tailwind classes for the confirm button.
         */
        function showConfirmationModal(message, onConfirm, confirmText = "Delete", cancelText = "Cancel", confirmColor = "bg-danger hover:bg-red-700") {
            const closeModal = () => {
                aiModalContainer.innerHTML = '';
            };

            const handleConfirm = () => {
                onConfirm();
                closeModal();
            };

            aiModalContainer.innerHTML = `
                <div class="ai-modal-overlay flex items-center justify-center p-4">
                    <div class="glass-card w-full max-w-sm p-6 rounded-2xl animate-entry relative text-center">
                        <svg class="mx-auto h-12 w-12 text-danger dark:text-red-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.394 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                        <h3 class="text-xl font-bold text-gray-900 dark:text-white mt-3 mb-2">Confirmation Required</h3>
                        <p class="text-gray-600 dark:text-gray-400 mb-6">${message}</p>
                        
                        <div class="flex justify-center space-x-3">
                            <button onclick="(${handleConfirm.toString()})()" class="py-2 px-4 rounded-xl font-semibold text-white transition duration-200 ${confirmColor}">
                                ${confirmText}
                            </button>
                            <button onclick="(${closeModal.toString()})()" class="py-2 px-4 rounded-xl font-semibold btn-secondary transition duration-200">
                                ${cancelText}
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }
        
        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                if (!file) return resolve(''); 
                if (file.size > 5 * 1024 * 1024) { 
                    return reject(new Error('File size exceeds 5MB limit.'));
                }

                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
                reader.readAsDataURL(file);
            });
        }

        // --- Authentication Logic (MOCK - Kept intact) ---

        function loadAuthState() {
            const storedUser = localStorage.getItem('currentUser');
            if (storedUser) {
                currentUser = JSON.parse(storedUser);
            }
            // Mock users for the login handler if they don't exist
             if (!localStorage.getItem('mockUsers')) {
                localStorage.setItem('mockUsers', JSON.stringify([
                    { name: 'John Smith', email: `john.s${EASWARI_DOMAIN}`, password: 'password123' },
                    { name: 'Jane Doe', email: `jane.d${EASWARI_DOMAIN}`, password: 'password123' }
                ]));
            }
        }

        function saveAuthState(user) {
            currentUser = user;
            localStorage.setItem('currentUser', JSON.stringify(user));
            renderPage(window.location.hash || '#home');
            renderFloatingMessenger(); 
        }

        function handleLogout() {
            currentUser = null;
            localStorage.removeItem('currentUser');
            showMessage('success', 'Logged out successfully.');
            renderPage('#home');
            renderFloatingMessenger(); 
        }

        function handleLogin(email, password) {
            const users = JSON.parse(localStorage.getItem('mockUsers') || '[]');
            const user = users.find(u => u.email === email && u.password === password);

            if (user) {
                saveAuthState({ email: user.email, name: user.name });
                showMessage('success', `Welcome back, ${user.name}!`);
                return true;
            } else {
                showMessage('error', 'Invalid email or password.');
                return false;
            }
        }

        function handleSignup(name, email, password) {
            if (!email.toLowerCase().endsWith(EASWARI_DOMAIN)) {
                showMessage('error', `Signup restricted. Must use a ${EASWARI_DOMAIN} email.`);
                return false;
            }

            let users = JSON.parse(localStorage.getItem('mockUsers') || '[]');
            if (users.some(u => u.email === email)) {
                showMessage('error', 'This email is already registered.');
                return false;
            }

            const newUser = { name, email, password };
            users.push(newUser);
            localStorage.setItem('mockUsers', JSON.stringify(users));
            saveAuthState({ email: newUser.email, name: newUser.name });
            showMessage('success', `Account created! Welcome, ${name}.`);
            return true;
        }


        // --- API & Data Handling (REAL IMPLEMENTATION) ---
        
        /**
         * Fetches all items from the Spring Boot backend API.
         */
        async function fetchItems() {
            try {
                // Fetch from the API endpoint defined in LostItemController.java
                const response = await fetch(`${BACKEND_BASE_URL}/api/lostitems`);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                // Update the global items array
                items = await response.json(); 
                items.sort((a, b) => b.id - a.id); // Sort by ID descending
                
                renderPage(window.location.hash || '#home');
            } catch (error) {
                console.error("Error fetching items from backend:", error);
                appContainer.innerHTML = `<div class="text-center p-10 glass-card rounded-2xl bg-danger/10 border border-danger dark:bg-danger/20">
                    <h2 class="text-2xl font-bold text-danger dark:text-red-400">Connection Error</h2>
                    <p class="mt-2 text-gray-700 dark:text-gray-300">Could not connect to the Spring Boot backend at <code>${BACKEND_BASE_URL}/api/lostitems</code>. Ensure your Java application is running.</p>
                </div>`;
            }
        }

        /**
         * Submits a new item report to the Spring Boot backend.
         */
        async function submitItem(item) {
            try {
                const response = await fetch(`${BACKEND_BASE_URL}/api/lostitems`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(item)
                });

                if (!response.ok) {
                    // Attempt to read error message from backend
                    const errorText = await response.text();
                    throw new Error(`Failed to submit report. Server responded with ${response.status}: ${errorText}`);
                }
                
                const newItem = await response.json();
                
                // Simulate match finding (still mock, but uses real saved item data)
                const matches = findPotentialMatches(newItem);
                sessionStorage.setItem('lastSubmissionMatches', JSON.stringify({ newItem, matches }));
                
                // Re-fetch all items to update the dashboard immediately
                await fetchItems(); 
                
                // Navigate to home to show the new item and match alert
                window.location.hash = '#home';

            } catch (error) {
                console.error("Error submitting item:", error);
                showMessage('error', `Submission failed: ${error.message.substring(0, 100)}...`);
            }
        }

        /**
         * Deletes an item report from the Spring Boot backend. (NEW FUNCTION)
         * This function requires the user to be the original poster.
         */
        async function deleteItemFromBackend(itemId) {
            const item = items.find(i => i.id == itemId);
            
            if (!item || item.contact !== currentUser.email) {
                showMessage('error', 'Unauthorized or item not found.');
                return;
            }

            // Use the custom confirmation modal
            showConfirmationModal(`Are you sure you want to permanently delete the report for "${item.title}"? This action cannot be undone.`, async () => {
                try {
                    const response = await fetch(`${BACKEND_BASE_URL}/api/lostitems/${itemId}`, {
                        method: 'DELETE',
                    });

                    if (response.ok) {
                        showMessage('success', `Report for "${item.title}" successfully deleted.`);
                        // Re-fetch items to update the dashboard
                        await fetchItems();
                        // Also clear any related chat history (mock, for demo purposes)
                        messages = messages.filter(t => t.itemId != itemId);
                        saveMessages();

                        window.location.hash = '#home';
                    } else {
                        const errorText = await response.text();
                        throw new Error(`Failed to delete report. Server responded with ${response.status}: ${errorText}`);
                    }
                } catch (error) {
                    console.error("Error deleting item:", error);
                    showMessage('error', `Deletion failed: ${error.message.substring(0, 100)}...`);
                }
            });
        }


        // --- Mock Utility Functions (Kept for chat simulation/logic) ---

        function findPotentialMatches(newItem) {
            const targetType = newItem.type === 'LOST' ? 'FOUND' : 'LOST';
            // Use the live items array now
            const activeOppositeItems = items.filter(i => i.type === targetType && i.status === 'ACTIVE');
            
            // ... (rest of the mock logic remains the same)
            
            const keywords = (newItem.title + ' ' + newItem.description + ' ' + newItem.location)
                .toLowerCase()
                .replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g,"")
                .split(/\s+/)
                .filter(k => k.length > 3);
            const uniqueKeywords = [...new Set(keywords)]; 

            const matches = activeOppositeItems.filter(oppositeItem => {
                if (oppositeItem.category === newItem.category) return true;

                const oppositeText = (oppositeItem.title + ' ' + oppositeItem.description + ' ' + oppositeItem.location).toLowerCase();
                
                let keywordCount = 0;
                for (const keyword of uniqueKeywords) {
                    if (oppositeText.includes(keyword)) {
                        keywordCount++;
                    }
                }
                return keywordCount >= 2; 
            });
            
            return matches.slice(0, 3); 
        }

        function markAsRecovered(itemId) {
            // NOTE: This function currently does not hit a backend endpoint for marking as recovered.
            // It only updates the local array for immediate viewing effect in the demo.
            const itemIndex = items.findIndex(i => i.id == itemId);
            if (itemIndex > -1) {
                const item = items[itemIndex];
                if (item.contact === currentUser.email && item.type === 'LOST' && item.status === 'ACTIVE') {
                    // This should ideally call a PUT/PATCH endpoint to update the status in the database
                    item.status = 'RECOVERED'; 
                    showMessage('success', `Item "${item.title}" successfully marked as recovered! (Note: Only client-side update in demo)`);
                    window.location.hash = '#home';
                } else {
                    showMessage('error', 'Operation failed: You do not have permission to mark this item as recovered.');
                }
            } else {
                 showMessage('error', 'Item not found.');
            }
        }

        // --- Messenger Logic (MOCK WEB SOCKET) ---

        function getOrCreateThread(itemId, initiatingUserEmail) {
            const item = items.find(i => i.id == itemId);
            if (!item) return null;

            const posterEmail = item.contact;
            let thread = messages.find(t => 
                t.itemId == itemId && 
                t.participants.includes(posterEmail) && 
                t.participants.includes(initiatingUserEmail)
            );

            if (!thread) {
                thread = {
                    itemId: itemId,
                    itemTitle: item.title,
                    participants: [posterEmail, initiatingUserEmail].sort(), 
                    messages: []
                };
                messages.push(thread);
                saveMessages();
            }
            return thread;
        }

        function sendMockMessage(itemId, messageText) {
            if (!currentUser || !messageText.trim()) {
                showMessage('error', 'Cannot send empty message.');
                return;
            }
            if (!isOnline) {
                showMessage('error', 'You are currently offline. Message will send upon reconnection.');
                return;
            }

            const thread = getOrCreateThread(itemId, currentUser.email);
            if (thread) {
                const newMessage = {
                    sender: currentUser.email,
                    text: messageText.trim(),
                    timestamp: Date.now(),
                    status: 'SENT' 
                };
                thread.messages.push(newMessage);
                saveMessages();
                
                // Simulate the server broadcasting the message back (and simulating the other user)
                simulateWebSocketReceive(thread.itemId, newMessage);

                // Re-render the chat window
                renderActiveChat();
            }
        }
        
        /** Simulates server sending the message back and also the other user responding */
        function simulateWebSocketReceive(itemId, lastSentMessage) {
            // 1. Simulate SENT -> DELIVERED status update
            setTimeout(() => {
                lastSentMessage.status = 'DELIVERED';
                saveMessages();
                renderActiveChat();
            }, 500);

            // 2. Simulate other user typing and responding
            const thread = messages.find(t => t.itemId === itemId);
            if (thread && thread.participants.length > 1) {
                const otherUserEmail = thread.participants.find(p => p !== currentUser.email);

                suggestedText = `Thank you so much for finding my ${item.title}! I'd love to arrange a convenient time and place on campus to meet and pick it up. Please let me know what works best for you.`;

                            <div>
                                <label for="signup-password" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Password</label>
                                <input type="password" id="signup-password" required placeholder="********" class="mt-1 block w-full p-3 border border-gray-300 rounded-lg focus:ring-primary focus:border-primary dark:bg-gray-700/50 dark:border-gray-600 dark:text-white">
                            </div>
                            <button type="submit" class="w-full btn-primary py-3 rounded-xl font-semibold shadow-lg shadow-primary/40">
                                Create Account
                            </button>
                        </form>
                        <p class="mt-6 text-center text-sm text-gray-600 dark:text-gray-400">
                            Already have an account? <a href="#login" class="text-primary dark:text-indigo-400 hover:text-indigo-800 font-medium transition">Log In here</a>
                        </p>
                    </div>
                </div>
            `;
            document.getElementById('signup-form').addEventListener('submit', function(e) {
                e.preventDefault();
                const name = document.getElementById('signup-name').value.trim();
                const email = document.getElementById('signup-email').value.trim();
                const password = document.getElementById('signup-password').value;
                if (handleSignup(name, email, password)) {
                    window.location.hash = '#home';
                }
            });
        }

        async function renderItemDetails(itemId) {
            const item = items.find(i => i.id == itemId);

            if (!item) {
                appContainer.innerHTML = `
                    <div class="text-center p-10 glass-card rounded-2xl">
                        <h2 class="text-2xl font-bold text-gray-800 dark:text-white">Item Not Found</h2>
                        <p class="mt-2 text-gray-600 dark:text-gray-400">The item with ID ${itemId} could not be located.</p>
                        <a href="#home" class="mt-4 inline-block btn-primary px-6 py-2 rounded-xl">Back to Home</a>
                    </div>
                `;
                return;
            }

            const isLost = item.type === 'LOST';
            const isPoster = currentUser && item.contact === currentUser.email;
            const isActive = item.status === 'ACTIVE'; // Client-side mock status check
            const isLoggedIn = !!currentUser;
            
            const typeColor = isLost ? 'border-danger dark:border-red-400/50' : 'border-success dark:border-green-400/50';
            const statusClass = isLost ? 'bg-danger text-white' : 'bg-success text-white';
            const statusText = isLost ? 'Lost Item' : 'Found Item';

            appContainer.innerHTML = `
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 p-8 glass-card rounded-3xl border-l-8 ${typeColor} shadow-2xl">
                    
                    <!-- Image and Status (Col 1/2) -->
                    <div class="lg:col-span-2">
                        <img src="${item.imageUrl}" 
                             alt="${item.title}" 
                             onerror="this.onerror=null;this.src='https://placehold.co/600x400/cccccc/333333?text=Image+Unavailable';"
                             class="w-full h-auto object-cover rounded-xl shadow-xl border border-gray-200 dark:border-gray-700 aspect-video">
                        
                        <div class="mt-8 flex items-center justify-between flex-wrap gap-4 border-b pb-4 border-gray-300 dark:border-gray-700">
                             <h1 class="text-4xl font-extrabold text-gray-900 dark:text-white">${item.title}</h1>
                             <span class="text-lg font-bold uppercase px-4 py-2 rounded-full ${statusClass} shadow-md">
                                 ${statusText}
                             </span>
                        </div>
                        
                        <div class="mt-6">
                            <h2 class="text-2xl font-semibold text-primary dark:text-indigo-400 mb-2">Detailed Description</h2>
                            <p class="text-lg text-gray-700 dark:text-gray-300 leading-relaxed">${item.description}</p>
                        </div>

                        ${!isActive ? `
                            <div class="mt-6 bg-gray-200/70 dark:bg-gray-800/50 border-l-4 border-gray-500 text-gray-800 dark:text-gray-300 p-4 rounded-md" role="alert">
                                <p class="font-bold">ITEM RESOLVED</p>
                                <p>This item has been successfully recovered or resolved and is no longer active in the dashboard.</p>
                            </div>
                        ` : ''}
                    </div>

                    <!-- Side Panel (Col 3) -->
                    <div class="lg:col-span-1 space-y-6">
                        
                        <!-- Management Section (NEW: Delete/Recover Buttons) -->
                        ${isPoster && isActive ? `
                            <div class="glass-card p-5 bg-gray-100/50 dark:bg-gray-800/50 border-gray-300/50 text-center rounded-xl shadow-lg">
                                <p class="text-lg font-semibold text-gray-800 dark:text-white mb-3">Manage Report</p>
                                
                                ${isLost ? `
                                    <button onclick="markAsRecovered(${item.id})" class="w-full bg-green-600 hover:bg-green-700 text-white py-2 rounded-xl font-semibold transition duration-200 transform hover:scale-105 shadow-md shadow-green-500/50 mb-3">
                                        Mark as Recovered
                                    </button>
                                ` : ''}

                                <button onclick="deleteItemFromBackend(${item.id})" class="w-full bg-danger hover:bg-red-700 text-white py-2 rounded-xl font-semibold transition duration-200 transform hover:scale-105 shadow-md shadow-danger/50">
                                    Permanently Delete Report
                                </button>
                                <p class="mt-2 text-xs text-gray-600 dark:text-gray-400">Caution: Deleting removes this item from the server permanently.</p>
                            </div>
                        ` : ''}

                        <div class="glass-card p-5 bg-gray-100/50 dark:bg-gray-800/50 rounded-xl shadow-lg">
                             <h2 class="text-2xl font-semibold text-gray-800 dark:text-white mb-4 border-b pb-2 text-themed">Key Info</h2>
                            
                            <ul class="space-y-3 text-gray-700 dark:text-gray-300">
                                <li class="flex items-center space-x-2"><span class="font-bold w-24 text-gray-600 dark:text-gray-400">Category:</span><span>${item.category}</span></li>
                                <li class="flex items-center space-x-2"><span class="font-bold w-24 text-gray-600 dark:text-gray-400">Location:</span><span class="text-primary dark:text-indigo-400 font-medium">${item.location}</span></li>
                                <li class="flex items-center space-x-2"><span class="font-bold w-24 text-gray-600 dark:text-gray-400">Report ID:</span><span class="text-xs text-gray-400">${item.id}</span></li>
                                <li class="flex items-center space-x-2"><span class="font-bold w-24 text-gray-600 dark:text-gray-400">Status:</span><span class="font-bold text-xs px-2 py-0.5 rounded ${isActive ? 'bg-yellow-200 text-yellow-800' : 'bg-gray-400 text-white'}">${item.status}</span></li>
                            </ul>
                        </div>
                        
                        <!-- Contact Section -->
                        <div class="glass-card p-5 bg-indigo-100/50 dark:bg-indigo-900/40 border-indigo-300/50 rounded-xl shadow-lg">
                            <h2 class="text-2xl font-semibold text-gray-800 dark:text-white mb-4 border-b pb-2 text-themed">Contact Poster</h2>
                            
                            ${isLoggedIn ? (isPoster ? `
                                <p class="text-sm text-gray-600 dark:text-gray-400 mb-3">You are the original poster of this item.</p>
                                <button onclick="openChat(${item.id})" class="mt-4 w-full text-center inline-block btn-primary py-2 rounded-xl text-sm font-medium transition duration-200 transform hover:scale-105">View Item Chat</button>
                            ` : `
                                <p class="text-sm text-gray-600 dark:text-gray-400 mb-3">The poster's identity is protected. Start a secure chat to coordinate.</p>
                                <button onclick="openChat(${item.id})" class="mt-4 w-full text-center inline-block btn-primary py-2 rounded-xl text-sm font-medium transition duration-200 transform hover:scale-105">Start Secure Chat</button>
                            `) : `
                                <p class="text-sm text-gray-600 dark:text-gray-400 mb-3">Log in to start a secure chat with the item poster.</p>
                                <a href="#login" class="mt-4 w-full text-center inline-block btn-secondary py-2 rounded-xl text-sm font-medium transition duration-200 transform hover:scale-105">Log In to Chat</a>
                            `}

                            <p class="mt-4 text-sm font-bold text-primary dark:text-indigo-400 break-words ${isPoster ? '' : 'hidden'}">${item.contact}</p>
                        </div>
                        
                         <a href="#home" class="w-full text-center inline-block btn-secondary py-2 rounded-xl text-sm font-medium transition duration-200 transform hover:scale-[1.02]">← Back to Dashboard</a>
                    </div>
                </div>
            `;
        }

        // --- Router (Kept intact) ---
        
        function renderPage(hash) {
            renderNavBar(); 
            
            // Fix: Check for currentUser existence before checking hash for restricted pages
            if ((hash === '#report') && !currentUser) {
                showMessage('error', 'Please log in to access this feature.');
                window.location.hash = '#login';
                return;
            }

            let filteredItems = items;
            
            if (hash === '#home' || hash === '') {
                let activeItems = items.filter(item => item.status !== 'RECOVERED');
                
                if (currentFilter === 'LOST') {
                    filteredItems = activeItems.filter(item => item.type === 'LOST');
                } else if (currentFilter === 'FOUND') {
                    filteredItems = activeItems.filter(item => item.type === 'FOUND');
                } else { 
                    filteredItems = activeItems;
                }
                
                renderHome(filteredItems);
            } 
            else if (hash.startsWith('#details-')) {
                const itemId = hash.substring(9);
                renderItemDetails(itemId);
            } else if (hash === '#report') {
                renderReportForm();
            } else if (hash === '#about') {
                // Simplified renderAboutPage since it was missing
                appContainer.innerHTML = `
                    <h1 class="text-4xl font-extrabold text-gray-900 dark:text-white mb-8">About the Portal</h1>
                    <div class="glass-card p-8 rounded-2xl space-y-4 text-gray-700 dark:text-gray-300">
                        <p>This is the **Lost & Found Portal** for Easwari Engineering College, designed as a mini-project demo.</p>
                        <p>It utilizes a **responsive HTML/Tailwind CSS/JavaScript** frontend with simulated back-end services (Mock API and Mock Messenger) to showcase key features like student-exclusive login, item reporting, AI matching, and secure private chat. The data persistence is handled by a separate Spring Boot backend application.</p>
                        <h3 class="text-xl font-bold pt-4 text-primary dark:text-indigo-400">Contact / Support</h3>
                        <p>For support, please contact the development team at <a href="mailto:support${EASWARI_DOMAIN}" class="text-primary dark:text-indigo-400 hover:underline">support${EASWARI_DOMAIN}</a>.</p>
                    </div>
                `;
            } else if (hash === '#login') {
                if (currentUser) {
                    window.location.hash = '#home'; 
                    return;
                }
                renderLoginPage();
            } else if (hash === '#signup') {
                if (currentUser) {
                    window.location.hash = '#home'; 
                    return;
                }
                renderSignupPage();
            } else { 
                renderHome(filteredItems);
            }
            window.scrollTo(0, 0); 
        }

        window.addEventListener('hashchange', () => renderPage(window.location.hash));
        
        // --- Initialization ---
        document.addEventListener('DOMContentLoaded', () => {
            try {
                // Initialize core functionality
                initTheme(); // Must run first to set up dark mode
                loadAuthState(); // Loads current user state
                renderNavBar(); // Renders the header first (shows 'Loading...' content)
                renderFloatingMessenger(); // Initializes the chat UI structure

                // Start the fetching and main rendering process
                fetchItems(); // Now calls the actual backend API
            } catch (e) {
                // CRITICAL FIX: Catches JS errors during init and provides visible feedback
                console.error("CRITICAL APPLICATION INIT ERROR:", e);
                appContainer.innerHTML = `
                    <div class="text-center p-10 glass-card rounded-2xl bg-danger/10 border border-danger dark:bg-danger/20">
                        <h2 class="text-2xl font-bold text-danger dark:text-red-400">Application Failed to Load</h2>
                        <p class="mt-2 text-gray-700 dark:text-gray-300">A critical JavaScript error occurred during initialization. Please check the browser console for details.</p>
                        <p class="mt-4 text-sm font-mono text-danger/80 break-words">Error: ${e.message}</p>
                        <a href="#" onclick="window.location.reload()" class="mt-4 inline-block btn-secondary px-6 py-2 rounded-xl">Try Reloading</a>
                    </div>
                `;
            }
        });
    </script>

</body>
</html>
